name : deploy_on_dockerhub
on:
  push:
    branches:
      - main
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: indrama/nodewithts_cicd:${{ github.sha }}
      - name: logout from DockerHub
        run: docker logout

      - name: connect to remote server
        uses: appleboy/ssh-action@v0.1.5
        env:
            ImageTag: ${{ github.sha }}
        with:
            host: ${{ secrets.REMOTE_HOST }}
            username: ${{ secrets.REMOTE_USERNAME }}
            password: ${{ secrets.REMOTE_PASSWORD }}
            envs: ImageTag
            script: |
                  set -e
                   cd ~/nodewithts_cicd
                   echo "Deploying image: $ImageTag"
                   if grep -q '^ImageTag=' .env; then
                   sed -i "s/^ImageTag=.*/ImageTag=$ImageTag/" .env
                   else
                   echo "ImageTag=$ImageTag" >> .env
                   fi
                   docker compose pull app
                   docker compose up -d --no-deps --wait --wait-timeout 60 app
                   docker compose ps
        