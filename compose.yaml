services:
  app:
    image: indrama/nodewithts_cicd:${IMAGE_TAG}
    container_name: nodewithts_cicd
    ports:
      - "3000:3000"
    env_file:
      - .env
    networks:
      - my-app-network
    healthcheck:
      test: ["CMD", "node","-e","const http = require('http').get('http://localhost:3000', res => { if (res.statusCode === 200) { process.exit(0); } else { process.exit(1); } }).on('error', () => { process.exit(1); });"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  nginx:
   image: nginx:alpine
   ports:
    - "80:80"
   networks:
      - my-app-network
   volumes:
     - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
   depends_on:
          app: 
            condition: service_healthy
   
networks:
  my-app-network:

